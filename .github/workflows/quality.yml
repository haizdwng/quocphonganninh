name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run quiz and data integrity tests
        run: node --experimental-default-type=module --test tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --experimental-default-type=module --check assets/js/app.js
          node --experimental-default-type=module --check assets/js/quiz.js
          node --experimental-default-type=module --check assets/js/storage.js
          node --check sw.js
