name: Validate quiz project

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/quiz.js
          node --check assets/js/storage.js
          node --check sw.js
      - name: Validate HTML references, offline assets, and question data
        run: node scripts/validate-project.mjs
      - name: Test quiz and localStorage logic
        run: node --experimental-default-type=module --test tests/*.test.mjs
