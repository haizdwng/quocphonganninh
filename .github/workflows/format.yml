name: Format project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format source files
        run: |
          npx --yes prettier@3 --write \
            ".prettierrc.json" \
            "index.html" \
            "assets/css/**/*.css" \
            "assets/js/**/*.js" \
            "assets/icons/**/*.svg" \
            "data/**/*.json" \
            "manifest.webmanifest" \
            "sw.js" \
            "tests/**/*.mjs" \
            "scripts/**/*.mjs" \
            ".github/workflows/*.yml"

      - name: Validate formatted project
        run: |
          node --check assets/js/app.js
          node --check assets/js/enhance.js
          node --check assets/js/quiz.js
          node --check assets/js/storage.js
          node --check sw.js
          node scripts/validate-project.mjs
          node --experimental-default-type=module --test tests/*.test.mjs

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Format project source files"
            git push origin HEAD:main
          fi
